<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Wasaz Ludo</title>
<!--
  WASAZ LUDO — single file, no dependencies.

  CONNECTING TO YOUR WEBSITE
  1. Upload this file (e.g. as ludo.html) to your site/repo.
  2. Link to it, or embed it:
       <iframe src="ludo.html?players=4&mode=cpu" style="width:100%;height:100vh;border:0"></iframe>
     URL options (optional): players=2|3|4   mode=cpu|local   (if both are given the game starts straight away)
  3. The game tells the parent page what happens using postMessage:
       { source:'wasaz-ludo', event:'gameStart', players, mode }
       { source:'wasaz-ludo', event:'gameEnd', winner:'red', humanWon:true, players, mode }
     On your site you can listen with:
       window.addEventListener('message', e => { if (e.data && e.data.source === 'wasaz-ludo') console.log(e.data); });
     (Check e.origin against your own domain before trusting it.)
-->
<style>
:root{--red:#e53935;--green:#43a047;--yellow:#fbc02d;--blue:#1e88e5;--gold:#e6b422;--bg:#0b0b0c;--panel:#18181b;--text:#f3efe6;--muted:#9a968c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:520px;padding:12px 12px 28px;display:flex;flex-direction:column;gap:12px}
header{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:22px;letter-spacing:.5px;color:var(--gold)}
h1 span{color:var(--red)}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.ghost{background:transparent;border:1px solid #3a3a40;border-radius:10px;padding:8px 12px;font-size:14px;color:var(--muted)}
.card{background:var(--panel);border:1px solid #2a2a2f;border-radius:16px;padding:16px}
.card h2{margin:0 0 12px;font-size:16px}
.row{display:flex;gap:8px;margin-bottom:14px}
.opt{flex:1;padding:12px 6px;border-radius:12px;background:#222227;border:2px solid transparent;font-weight:600}
.opt.sel{border-color:var(--gold);color:var(--gold)}
.label{font-size:13px;color:var(--muted);margin:0 0 6px}
.primary{width:100%;padding:14px;border-radius:14px;background:var(--gold);color:#1a1400;font-weight:800;font-size:17px}
.primary:disabled{opacity:.45}
#chips{display:flex;gap:6px}
.chip{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 4px;border-radius:10px;background:var(--panel);border:2px solid transparent;font-size:13px}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.chip.on{border-color:var(--gold)}
#turn{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;min-height:26px}
#turn i{width:16px;height:16px;border-radius:50%}
#msg{color:var(--muted);font-size:14px;min-height:20px;margin-top:-6px}
#board{position:relative;width:100%;aspect-ratio:1;display:grid;grid-template:repeat(15,1fr)/repeat(15,1fr);border:3px solid var(--gold);border-radius:14px;overflow:hidden;background:#f4f0e4;touch-action:manipulation}
.cell{border:.5px solid rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:clamp(8px,2.6vw,14px);color:rgba(0,0,0,.35)}
.cell.red{background:var(--red)}.cell.green{background:var(--green)}.cell.yellow{background:var(--yellow)}.cell.blue{background:var(--blue)}
.cell.inner{background:#fff;border:0}
.cell.inner.red{background:#ffd9d8}.cell.inner.green{background:#d6efd8}.cell.inner.yellow{background:#fff0bd}.cell.inner.blue{background:#cfe5fb}
.cell.base{border:0}
.cell.path{background:#f9f6ec}
.cell.path.red,.cell.path.green,.cell.path.yellow,.cell.path.blue{color:rgba(255,255,255,.85)}
.cell.path.red{background:var(--red)}.cell.path.green{background:var(--green)}.cell.path.yellow{background:var(--yellow)}.cell.path.blue{background:var(--blue)}
#center{grid-area:7/7/10/10;background:conic-gradient(from -45deg,var(--green) 0 90deg,var(--yellow) 90deg 180deg,var(--blue) 180deg 270deg,var(--red) 270deg 360deg);border:.5px solid rgba(0,0,0,.25)}
.token{position:absolute;width:5.3%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);border:2.5px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.55),inset 0 -3px 5px rgba(0,0,0,.3),inset 0 3px 4px rgba(255,255,255,.45);transition:left .16s linear,top .16s linear;padding:0}
.token.stack{width:4.4%}
.token::after{content:"";position:absolute;inset:-35%;border-radius:50%}
.token.can{animation:pulse .8s ease-in-out infinite;cursor:pointer;outline:3px solid var(--gold);outline-offset:1px}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.22)}}
#controls{display:flex;align-items:center;gap:14px;justify-content:center}
.die{width:68px;height:68px;border-radius:14px;background:#fff;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:9px;box-shadow:0 3px 10px rgba(0,0,0,.5)}
.die span{border-radius:50%;margin:auto;width:70%;height:70%}
.die span.on{background:#111}
.die.rolling{animation:shake .15s linear infinite}
@keyframes shake{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#rollBtn{flex:1;max-width:240px;padding:18px;border-radius:16px;font-weight:800;font-size:19px;color:#fff;background:var(--red);transition:background .2s}
#rollBtn:disabled{opacity:.4}
#win{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:24px;z-index:50}
#win .card{text-align:center;max-width:340px;width:100%}
#win h2{font-size:26px;color:var(--gold);margin-bottom:6px}
#win p{color:var(--muted);margin:0 0 18px}
#win .primary{margin-bottom:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>WASAZ <span>LUDO</span></h1>
    <button class="ghost" id="newBtn" hidden>New game</button>
  </header>

  <section id="setup" class="card">
    <h2>Start a game</h2>
    <p class="label">Players</p>
    <div class="row" id="optPlayers">
      <button class="opt" data-v="2">2</button>
      <button class="opt sel" data-v="3">3</button>
      <button class="opt" data-v="4">4</button>
    </div>
    <p class="label">Mode</p>
    <div class="row" id="optMode">
      <button class="opt sel" data-v="cpu">You vs Computer</button>
      <button class="opt" data-v="local">Pass &amp; Play</button>
    </div>
    <button class="primary" id="startBtn">Start</button>
    <p class="label" style="margin:14px 0 0">Roll a 6 to bring a token out. Land on another colour to send it home (not on safe squares ★). Get all 4 tokens to the centre first.</p>
  </section>

  <section id="game" hidden>
    <div id="chips"></div>
    <div id="turn"></div>
    <div id="msg"></div>
    <div id="board"></div>
    <div id="controls">
      <div class="die" id="die"></div>
      <button id="rollBtn">Roll</button>
    </div>
  </section>
</div>

<div id="win" hidden>
  <div class="card">
    <h2 id="winTitle">Winner!</h2>
    <p id="winSub"></p>
    <button class="primary" id="againBtn">Play again</button>
    <button class="ghost" id="setupBtn" style="width:100%">Change setup</button>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const NAMES=['Red','Green','Yellow','Blue'];
const HEX=['#e53935','#43a047','#fbc02d','#1e88e5'];
const CLS=['red','green','yellow','blue'];
const START=[0,13,26,39];
const SAFE=new Set([0,8,13,21,26,34,39,47]);

/* ---- board geometry (15x15) ---- */
const PATH=[];
(function(){
  const seg=(r,c,dr,dc,n)=>{for(let i=0;i<n;i++)PATH.push([r+dr*i,c+dc*i]);};
  seg(6,1,0,1,5);seg(5,6,-1,0,6);seg(0,7,0,1,2);seg(1,8,1,0,5);
  seg(6,9,0,1,6);seg(7,14,1,0,2);seg(8,13,0,-1,5);seg(9,8,1,0,6);
  seg(14,7,0,-1,2);seg(13,6,-1,0,5);seg(8,5,0,-1,6);seg(7,0,-1,0,2);
})();
const HOMECOL=[
  [1,2,3,4,5].map(c=>[7,c]),
  [1,2,3,4,5].map(r=>[r,7]),
  [13,12,11,10,9].map(c=>[7,c]),
  [13,12,11,10,9].map(r=>[r,7])
];
const MIDS=[[2.5,2.5],[2.5,11.5],[11.5,11.5],[11.5,2.5]];
const BASE=MIDS.map(([r,c])=>[[r-.8,c-.8],[r-.8,c+.8],[r+.8,c-.8],[r+.8,c+.8]]);
const FIN=[[0,-.6],[-.6,0],[0,.6],[.6,0]];

/* ---- state ---- */
let G=null, counter=0, setup={players:3,mode:'cpu'};

const isBot=pl=>!G.human.includes(pl);
const label=pl=>G.mode==='cpu'?(pl===0?'You':NAMES[pl]):NAMES[pl];
const alive=id=>G&&G.id===id&&!G.over;
const absPos=(pl,p)=>(START[pl]+p)%52;

function coord(pl,tk){
  const p=tk.p;
  if(p<0)return BASE[pl][tk.i];
  if(p<=50)return PATH[absPos(pl,p)];
  if(p<=55)return HOMECOL[pl][p-51];
  return [7+FIN[pl][0],7+FIN[pl][1]];
}

/* ---- setup UI ---- */
function bindOpts(id,key,num){
  $(id).addEventListener('click',e=>{
    const b=e.target.closest('.opt');if(!b)return;
    [...$(id).children].forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    setup[key]=num?+b.dataset.v:b.dataset.v;
  });
}
bindOpts('optPlayers','players',true);
bindOpts('optMode','mode',false);
$('startBtn').onclick=()=>startGame(setup.players,setup.mode);
$('newBtn').onclick=toSetup;
$('setupBtn').onclick=toSetup;
$('againBtn').onclick=()=>startGame(G.n,G.mode);
$('rollBtn').onclick=doRoll;

function toSetup(){
  if(G)G.over=true;
  $('win').hidden=true;$('game').hidden=true;$('newBtn').hidden=true;$('setup').hidden=false;
}

/* ---- build ---- */
function buildBoard(){
  const b=$('board');b.innerHTML='';
  const pathIdx={};PATH.forEach(([r,c],i)=>pathIdx[r+','+c]=i);
  const homeCol={};HOMECOL.forEach((arr,pl)=>arr.forEach(([r,c])=>homeCol[r+','+c]=pl));
  const startCell={};START.forEach((s,pl)=>startCell[s]=pl);
  for(let r=0;r<15;r++)for(let c=0;c<15;c++){
    if(r>=6&&r<=8&&c>=6&&c<=8)continue;
    const d=document.createElement('div');d.className='cell';
    d.style.gridArea=(r+1)+'/'+(c+1);
    const k=r+','+c;
    let q=-1;
    if(r<6&&c<6)q=0;else if(r<6&&c>8)q=1;else if(r>8&&c>8)q=2;else if(r>8&&c<6)q=3;
    if(q>=0){
      d.classList.add('base',CLS[q]);
      const [mr,mc]=MIDS[q];
      if(Math.abs(r-mr)<=2&&Math.abs(c-mc)<=2)d.classList.add('inner');
    }else if(k in pathIdx){
      d.classList.add('path');
      const i=pathIdx[k];
      if(i in startCell)d.classList.add(CLS[startCell[i]]);
      else if(SAFE.has(i))d.textContent='★';
    }else if(k in homeCol){
      d.classList.add('path',CLS[homeCol[k]]);
    }
    b.appendChild(d);
  }
  const ctr=document.createElement('div');ctr.id='center';b.appendChild(ctr);
}

function buildDie(){
  const d=$('die');d.innerHTML='';
  for(let i=0;i<9;i++)d.appendChild(document.createElement('span'));
}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
function showDie(v){
  const s=$('die').children;
  for(let i=0;i<9;i++)s[i].classList.toggle('on',PIPS[v].includes(i));
}

function startGame(n,mode){
  const active=n===2?[0,2]:n===3?[0,1,2]:[0,1,2,3];
  G={id:++counter,n,mode,active,cur:active[0],roll:0,rolled:false,sixes:0,busy:false,over:false,
     human:mode==='cpu'?[0]:active.slice(),
     tokens:[0,1,2,3].map(pl=>[0,1,2,3].map(i=>({pl,i,p:-1,el:null})))};
  $('setup').hidden=true;$('win').hidden=true;$('game').hidden=false;$('newBtn').hidden=false;
  buildBoard();buildDie();showDie(1);
  const board=$('board');
  for(const pl of active)for(const tk of G.tokens[pl]){
    const el=document.createElement('button');
    el.className='token';el.style.background=HEX[pl];
    el.setAttribute('aria-label',NAMES[pl]+' token '+(tk.i+1));
    el.onclick=()=>onToken(tk);
    tk.el=el;board.appendChild(el);
  }
  render();updateUI();
  msg(isBot(G.cur)?'':'Roll the dice to begin');
  post('gameStart',{});
  maybeBot();
}

/* ---- rendering ---- */
function render(){
  const groups={};
  for(const pl of G.active)for(const tk of G.tokens[pl]){
    const [r,c]=coord(pl,tk);
    const k=r.toFixed(2)+','+c.toFixed(2);
    (groups[k]=groups[k]||[]).push([tk,r,c]);
  }
  for(const k in groups){
    const g=groups[k];
    g.forEach(([tk,r,c],idx)=>{
      const off=g.length>1?(idx-(g.length-1)/2)*.3:0;
      tk.el.style.left=((c+.5+off)/15*100)+'%';
      tk.el.style.top=((r+.5)/15*100)+'%';
      tk.el.style.zIndex=10+idx;
      tk.el.classList.toggle('stack',g.length>1);
    });
  }
}
function msg(t){$('msg').textContent=t||'';}
function updateUI(){
  const pl=G.cur;
  $('chips').innerHTML='';
  for(const a of G.active){
    const done=G.tokens[a].filter(t=>t.p===56).length;
    const c=document.createElement('div');c.className='chip'+(a===pl?' on':'');
    c.innerHTML='<i style="background:'+HEX[a]+'"></i>'+done+'/4';
    $('chips').appendChild(c);
  }
  $('turn').innerHTML='<i style="background:'+HEX[pl]+'"></i>'+(label(pl)==='You'?'Your turn':label(pl)+(isBot(pl)?' (computer)':"'s turn"));
  const b=$('rollBtn');
  b.style.background=HEX[pl];
  b.style.color=pl===2?'#1a1400':'#fff';
  b.disabled=G.busy||G.rolled||isBot(pl)||G.over;
}
function clearHighlight(){for(const pl of G.active)for(const t of G.tokens[pl])t.el.classList.remove('can');}

/* ---- rules ---- */
function movable(pl,v){
  return G.tokens[pl].filter(t=>t.p===-1?v===6:(t.p<56&&t.p+v<=56));
}
function danger(pl,abs){
  for(const o of G.active){
    if(o===pl)continue;
    for(const t of G.tokens[o]){
      if(t.p<0||t.p>50)continue;
      const d=(abs-absPos(o,t.p)+52)%52;
      if(d>=1&&d<=6)return true;
    }
  }
  return false;
}
function canCapture(pl,abs){
  if(SAFE.has(abs))return false;
  return G.active.some(o=>o!==pl&&G.tokens[o].some(t=>t.p>=0&&t.p<=50&&absPos(o,t.p)===abs));
}
function botPick(pl,v,mv){
  let best=mv[0],bs=-1e9;
  for(const tk of mv){
    const np=tk.p===-1?0:tk.p+v;
    let s=0;
    if(np===56)s+=100;
    else if(np>50)s+=40+np;
    else{
      const a=absPos(pl,np);
      if(canCapture(pl,a))s+=80;
      if(SAFE.has(a))s+=25;else if(danger(pl,a))s-=30;
    }
    if(tk.p===-1)s+=45;
    if(tk.p>=0&&tk.p<=50){const a=absPos(pl,tk.p);if(!SAFE.has(a)&&danger(pl,a))s+=20;}
    s+=np*.3+Math.random();
    if(s>bs){bs=s;best=tk;}
  }
  return best;
}

/* ---- turn flow ---- */
async function doRoll(){
  if(!G||G.busy||G.rolled||G.over)return;
  const id=G.id;
  G.busy=true;updateUI();msg('');
  $('die').classList.add('rolling');
  for(let i=0;i<8;i++){showDie(1+Math.floor(Math.random()*6));await sleep(70);if(!alive(id))return;}
  $('die').classList.remove('rolling');
  const v=1+Math.floor(Math.random()*6);
  showDie(v);G.roll=v;
  G.sixes=v===6?G.sixes+1:0;
  if(G.sixes>=3){
    msg('Three 6s in a row — turn lost');
    await sleep(1200);if(!alive(id))return;
    return nextTurn();
  }
  const mv=movable(G.cur,v);
  if(!mv.length){
    msg(label(G.cur)+(label(G.cur)==='You'?': no moves':' has no moves'));
    await sleep(1000);if(!alive(id))return;
    return nextTurn();
  }
  G.rolled=true;
  if(isBot(G.cur)||mv.length===1){
    await sleep(isBot(G.cur)?650:350);if(!alive(id))return;
    const tk=isBot(G.cur)?botPick(G.cur,v,mv):mv[0];
    return applyMove(tk,v);
  }
  G.busy=false;
  mv.forEach(t=>t.el.classList.add('can'));
  msg('Tap a glowing token to move');
  updateUI();
}
function onToken(tk){
  if(!G||G.over||G.busy||!G.rolled||tk.pl!==G.cur||isBot(G.cur))return;
  if(!movable(G.cur,G.roll).includes(tk))return;
  applyMove(tk,G.roll);
}
async function applyMove(tk,v){
  const id=G.id;
  G.busy=true;clearHighlight();updateUI();msg('');
  if(tk.p===-1){tk.p=0;render();await sleep(240);}
  else for(let s=0;s<v;s++){tk.p++;render();await sleep(170);if(!alive(id))return;}
  if(!alive(id))return;
  let captured=false;
  if(tk.p<=50){
    const a=absPos(tk.pl,tk.p);
    if(!SAFE.has(a)){
      for(const o of G.active){
        if(o===tk.pl)continue;
        for(const t of G.tokens[o])if(t.p>=0&&t.p<=50&&absPos(o,t.p)===a){t.p=-1;captured=true;}
      }
    }
  }
  render();
  if(G.tokens[tk.pl].every(t=>t.p===56)){updateUI();return win(tk.pl);}
  const finished=tk.p===56;
  if(captured)msg('Captured! Roll again');
  else if(finished)msg('Home! Roll again');
  else if(v===6)msg('Rolled a 6 — roll again');
  await sleep(captured?700:250);if(!alive(id))return;
  if(v===6||captured||finished){
    G.rolled=false;G.busy=false;updateUI();maybeBot();
  }else nextTurn();
}
function nextTurn(){
  G.sixes=0;
  const a=G.active;
  G.cur=a[(a.indexOf(G.cur)+1)%a.length];
  G.rolled=false;G.busy=false;
  msg('');updateUI();maybeBot();
}
function maybeBot(){
  if(!G||G.over||!isBot(G.cur))return;
  const id=G.id;
  setTimeout(()=>{if(alive(id))doRoll();},800);
}

/* ---- finish ---- */
function win(pl){
  G.over=true;
  const humanWon=G.human.includes(pl);
  $('winTitle').textContent=G.mode==='cpu'?(pl===0?'You win! 🎉':NAMES[pl]+' wins'):NAMES[pl]+' wins! 🎉';
  $('winSub').textContent=G.mode==='cpu'?(pl===0?'All four tokens made it home.':'The computer got there first. Try again?'):'All four tokens made it home.';
  $('win').hidden=false;
  post('gameEnd',{winner:CLS[pl],humanWon});
}
function post(event,extra){
  try{
    if(window.parent&&window.parent!==window){
      window.parent.postMessage(Object.assign({source:'wasaz-ludo',event,players:G.n,mode:G.mode},extra),'*');
    }
  }catch(e){}
}

/* ---- optional auto-start from URL ---- */
(function(){
  const q=new URLSearchParams(location.search);
  const n=+q.get('players'),m=q.get('mode');
  if([2,3,4].includes(n)&&(m==='cpu'||m==='local'))startGame(n,m);
})();
})();
</script>
</body>
</html>
